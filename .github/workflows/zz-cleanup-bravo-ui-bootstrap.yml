name: Final cleanup Bravo UI bootstrap

on:
  push:
    branches:
      - fix/bravo-0.7-spark-quota-ui
    paths:
      - .github/workflows/zz-cleanup-bravo-ui-bootstrap.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bravo-0.7-spark-quota-ui
          fetch-depth: 0

      - name: Remove all temporary transport files
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f src/features/bravo/bravoQuotaPresentation.ts
          test -f tests/bravoQuotaPresentation.test.ts
          if [ -d .github/bravo-bootstrap ]; then
            git rm -rf .github/bravo-bootstrap
          fi
          for path in \
            .github/workflows/bootstrap-bravo-0.7-ui.yml \
            .github/workflows/apply-bravo-0.7-ui-v2.yml \
            .github/workflows/cleanup-bravo-0.7-ui-bootstrap.yml \
            .github/workflows/cleanup-bravo-0.7-ui-bootstrap-v2.yml \
            .github/workflows/zz-cleanup-bravo-ui-bootstrap.yml
          do
            if [ -e "$path" ]; then
              git rm -f "$path"
            fi
          done
          git diff --cached --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Nothing to clean"
            exit 0
          fi
          git commit -m "chore: remove temporary Bravo UI bootstrap"
          git push origin HEAD:fix/bravo-0.7-spark-quota-ui
