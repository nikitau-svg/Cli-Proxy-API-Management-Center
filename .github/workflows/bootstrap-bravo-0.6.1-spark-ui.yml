name: Bootstrap Bravo 0.6.1 Spark UI patch

on:
  push:
    branches:
      - fix/bravo-0.6.1-spark-quota-ui
    paths:
      - .github/workflows/bootstrap-bravo-0.6.1-spark-ui.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/bravo-0.6.1-spark-quota-ui
          fetch-depth: 0

      - name: Verify expected base ancestry
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE=f204c5251416086fb33d44cafe1c14490cfbb2e2
          git merge-base --is-ancestor "$BASE" HEAD
          test -z "$(git diff --name-only "$BASE"...HEAD -- . \
            ':(exclude).github/bravo-bootstrap/ui-patch.zip.b64' \
            ':(exclude).github/workflows/bootstrap-bravo-0.6.1-spark-ui.yml')"

      - name: Decode and apply reviewed patch set
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/bravo-ui-patch
          mkdir -p /tmp/bravo-ui-patch
          base64 --decode .github/bravo-bootstrap/ui-patch.zip.b64 > /tmp/bravo-ui-patch.zip
          unzip -q /tmp/bravo-ui-patch.zip -d /tmp/bravo-ui-patch
          python3 /tmp/bravo-ui-patch/apply_frontend.py "$GITHUB_WORKSPACE" --allow-non-exact-base
          python3 /tmp/bravo-ui-patch/apply_frontend_hardening.py "$GITHUB_WORKSPACE" --allow-non-exact-base
          python3 /tmp/bravo-ui-patch/apply_frontend_summary.py "$GITHUB_WORKSPACE" --allow-non-exact-base
          git diff --check

      - name: Verify Bun tests, lint, types and production build
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE='oven/bun:1.3.14@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4'
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$IMAGE" \
            bun install --frozen-lockfile
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$IMAGE" \
            bun run verify

      - name: Commit verified generated changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Bravo Patch Bot'
          git config user.email 'noreply@slowdive.app'
          git add -A
          git commit -m 'feat(bravo): expose Spark with independent quota UX'
          git push origin HEAD:fix/bravo-0.6.1-spark-quota-ui
