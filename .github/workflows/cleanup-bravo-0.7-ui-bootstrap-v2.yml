name: Cleanup Bravo 0.7 UI bootstrap v2

on:
  push:
    branches:
      - fix/bravo-0.7-spark-quota-ui
    paths:
      - .github/workflows/cleanup-bravo-0.7-ui-bootstrap-v2.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/bravo-0.7-spark-quota-ui
          fetch-depth: 0

      - name: Confirm verified source commit exists
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f src/features/bravo/bravoQuotaPresentation.ts
          test -f tests/bravoQuotaPresentation.test.ts
          git log -n 20 --format=%s | grep -F "feat(bravo): expose Spark and independent quota state"

      - name: Remove temporary bootstrap transport
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm -rf .github/bravo-bootstrap
          git rm -f .github/workflows/bootstrap-bravo-0.7-ui.yml
          git rm -f .github/workflows/apply-bravo-0.7-ui-v2.yml
          git rm -f .github/workflows/cleanup-bravo-0.7-ui-bootstrap.yml
          git rm -f .github/workflows/cleanup-bravo-0.7-ui-bootstrap-v2.yml
          git diff --cached --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary Bravo UI bootstrap"
          git push origin HEAD:fix/bravo-0.7-spark-quota-ui
