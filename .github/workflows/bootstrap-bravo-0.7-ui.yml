name: Bootstrap Bravo 0.7 UI patch

on:
  push:
    branches:
      - fix/bravo-0.7-spark-quota-ui
    paths:
      - .github/workflows/bootstrap-bravo-0.7-ui.yml
      - .github/bravo-bootstrap/ui-patch.part-*.b64
  pull_request:
    branches:
      - agent/bravo-0.6-production-ui
    paths:
      - .github/workflows/bootstrap-bravo-0.7-ui.yml
      - .github/bravo-bootstrap/ui-patch.part-*.b64

permissions:
  contents: write

concurrency:
  group: bootstrap-bravo-0.7-ui
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/bravo-0.7-spark-quota-ui
          fetch-depth: 0

      - name: Export exact checkout for local diagnosis
        shell: bash
        run: |
          set -Eeuo pipefail
          tar --exclude=.git -czf /tmp/bravo-ui-checkout.tgz .

      - name: Upload exact checkout
        uses: actions/upload-artifact@v4
        with:
          name: bravo-ui-checkout
          path: /tmp/bravo-ui-checkout.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Decode and apply reviewed patchers
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash -c '
            set -Eeuo pipefail
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            start_sha="$(git rev-parse HEAD)"
            echo "BRAVO_BOOTSTRAP_START_SHA=$start_sha" >> "$GITHUB_ENV"

            cat .github/bravo-bootstrap/ui-patch.part-*.b64 > /tmp/bravo-ui-patch.b64
            base64 --decode /tmp/bravo-ui-patch.b64 > /tmp/bravo-ui-patch.zip
            test "$(sha256sum /tmp/bravo-ui-patch.zip | cut -d" " -f1)" = "22498ae3544da1041020653044597dc8a31d40712cdb433d0f5e1bc38a361bd9"
            mkdir -p /tmp/bravo-ui-patch
            unzip -q /tmp/bravo-ui-patch.zip -d /tmp/bravo-ui-patch

            python3 /tmp/bravo-ui-patch/apply_frontend.py "$GITHUB_WORKSPACE" --allow-non-exact-base
            git add -A
            git commit -m "chore: apply Bravo UI quota base patch"

            python3 /tmp/bravo-ui-patch/apply_frontend_hardening.py "$GITHUB_WORKSPACE" --allow-non-exact-base
            git add -A
            git commit -m "chore: apply Bravo UI quota hardening"

            python3 /tmp/bravo-ui-patch/apply_frontend_summary.py "$GITHUB_WORKSPACE" --allow-non-exact-base
            git add -A
            git commit -m "chore: apply Bravo UI quota presentation"

            git diff --check "$start_sha"..HEAD
          ' > /tmp/bravo-ui-bootstrap.log 2>&1
          rc=$?
          cat /tmp/bravo-ui-bootstrap.log
          tar --exclude=.git -czf /tmp/bravo-ui-after-patch.tgz . || true
          exit "$rc"

      - name: Upload bootstrap diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bravo-ui-bootstrap-diagnostics
          path: |
            /tmp/bravo-ui-bootstrap.log
            /tmp/bravo-ui-after-patch.tgz
            /tmp/bravo-ui-patch.zip
          if-no-files-found: warn
          retention-days: 1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify tests, lint, types and production build
        shell: bash
        run: |
          set -Eeuo pipefail
          bun install --frozen-lockfile
          bun run verify

      - name: Squash and push verified source changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git reset --soft "$BRAVO_BOOTSTRAP_START_SHA"
          git diff --cached --check
          git diff --cached --quiet && { echo "Patch produced no source changes" >&2; exit 1; }
          git commit -m "feat(bravo): expose Spark and independent quota state"
          git push origin HEAD:fix/bravo-0.7-spark-quota-ui
