name: Apply Bravo 0.7 UI source patch v2

on:
  push:
    branches:
      - fix/bravo-0.7-spark-quota-ui
    paths:
      - .github/workflows/apply-bravo-0.7-ui-v2.yml

permissions:
  contents: write

concurrency:
  group: apply-bravo-0.7-ui-v2
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/bravo-0.7-spark-quota-ui
          fetch-depth: 0

      - name: Reconstruct and apply reviewed source patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .github/bravo-bootstrap/ui-source.part-*.b64 > /tmp/bravo-ui-source.patch.b64
          base64 --decode /tmp/bravo-ui-source.patch.b64 > /tmp/bravo-ui-source.patch
          test "$(sha256sum /tmp/bravo-ui-source.patch | cut -d' ' -f1)" = "f01be654783ef44fad57fae1b42214c6b75b06f278b29508b7cb4ba9e1f3bf61"
          git apply --check /tmp/bravo-ui-source.patch
          git apply /tmp/bravo-ui-source.patch
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/bravoAdmin.test.tsx')
          text = path.read_text()
          old = """  expect(html).toContain('>2 hour<');
            expect(html).toContain('>Weekly<');
          """
          new = """  expect(html).toContain('>Codex<');
            expect(html).not.toContain('>2 hour<');
            expect(html).not.toContain('>Weekly<');
          """
          if old not in text:
              raise SystemExit('bravoAdmin quota-label expectation anchor missing')
          path.write_text(text.replace(old, new, 1))

          path = Path('tests/bravoAdminShell.test.tsx')
          text = path.read_text()
          old = "  expect(html).toContain('>Short<');\n"
          new = "  expect(html).toContain('>Codex<');\n  expect(html).not.toContain('>Short<');\n"
          if old not in text:
              raise SystemExit('bravoAdminShell quota-label expectation anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify tests, lint, types and production build
        shell: bash
        run: |
          set -uo pipefail
          set +e
          {
            bun install --frozen-lockfile
            bun run verify
          } > /tmp/bravo-ui-verify-v2.log 2>&1
          rc=$?
          cat /tmp/bravo-ui-verify-v2.log
          exit "$rc"

      - name: Upload UI verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bravo-ui-verify-v2-diagnostics
          path: /tmp/bravo-ui-verify-v2.log
          if-no-files-found: warn
          retention-days: 1

      - name: Commit verified UI source changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --check
          git diff --cached --quiet && { echo "Patch produced no source changes" >&2; exit 1; }
          git commit -m "feat(bravo): expose Spark and independent quota state"
          git push origin HEAD:fix/bravo-0.7-spark-quota-ui
